name: Contribution Bot

on:
  workflow_call:
    inputs:
      client-id:
        description: Client ID of the GitHub App the bot runs as.
        type: string
        required: true
      store-repository:
        description: Repository holding the contributors file (owner/name), owned by the same account as the calling repository.
        type: string
        required: true
      store-branch:
        description: Branch holding the contributors file. Defaults to "main".
        type: string
        required: false
      store-path:
        description: Path of the contributors file. Defaults to "contributors.json".
        type: string
        required: false
      command-prefix:
        description: Prefix starting every bot command, such as @my-bot.
        type: string
        required: true
      cla-url:
        description: Public URL of the Contributor License Agreement. Defaults to "https://github.com/AvaloniaUI/Avalonia/blob/main/CLA.md".
        type: string
        required: false
      introduction-url:
        description: URL where new contributors introduce themselves. Defaults to "https://github.com/AvaloniaUI/Avalonia/discussions/categories/introductions".
        type: string
        required: false
      status-context:
        description: Context name of the commit status. Defaults to "Avalonia Contribution / CLA".
        type: string
        required: false
      dry-run:
        description: Log write operations instead of performing them.
        type: boolean
        required: false
        default: false
    secrets:
      private-key:
        description: Private key of the GitHub App the bot runs as.
        required: true

permissions: {}

jobs:
  bot:
    # Comments that can't hold a command don't start a runner. Comments posted by bots, including this one, are skipped too.
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        github.event.comment.user.type != 'Bot' && contains(github.event.comment.body, inputs.command-prefix)) ||
      (github.event_name == 'discussion_comment' &&
        github.event.comment.user.type != 'Bot' && contains(github.event.comment.body, inputs.command-prefix))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Check the store repository
        id: store
        shell: bash
        env:
          STORE_REPOSITORY: ${{ inputs.store-repository }}
        run: |
          set -euo pipefail

          owner="${STORE_REPOSITORY%%/*}"
          if [[ "$owner" != "$GITHUB_REPOSITORY_OWNER" ]]; then
            echo "::error::The store repository must belong to $GITHUB_REPOSITORY_OWNER, got $STORE_REPOSITORY."
            exit 1
          fi

          echo "name=${STORE_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      - name: Create the GitHub App token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ inputs.client-id }}
          private-key: ${{ secrets.private-key }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
            ${{ steps.store.outputs.name }}
          permission-contents: write
          permission-discussions: write
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: write

      - name: Download bot
        shell: bash
        env:
          # Written by the release workflow in the commit of each release tag.
          BOT_REPOSITORY: ""
          BOT_TAG: ""
          BOT_SHA256: ""
        run: |
          set -euo pipefail

          if [[ -z "$BOT_TAG" ]]; then
            echo "::error::This workflow only runs from a release tag, such as @v1."
            exit 1
          fi

          bot="$RUNNER_TEMP/avalonia-contribution-bot"
          curl --fail --silent --show-error --location --retry 3 --output "$bot" \
            "https://github.com/$BOT_REPOSITORY/releases/download/$BOT_TAG/avalonia-contribution-bot-linux-x64"
          echo "$BOT_SHA256  $bot" | sha256sum --check --strict
          chmod +x "$bot"

      - name: Run bot
        shell: bash
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          STORE_REPOSITORY: ${{ inputs.store-repository }}
          STORE_BRANCH: ${{ inputs.store-branch }}
          STORE_PATH: ${{ inputs.store-path }}
          COMMAND_PREFIX: ${{ inputs.command-prefix }}
          CLA_URL: ${{ inputs.cla-url }}
          INTRODUCTION_URL: ${{ inputs.introduction-url }}
          STATUS_CONTEXT: ${{ inputs.status-context }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail

          args=(
            --event-name "$GITHUB_EVENT_NAME"
            --event-file "$GITHUB_EVENT_PATH"
            --store-repository "$STORE_REPOSITORY"
            --command-prefix "$COMMAND_PREFIX"
          )

          # Empty inputs keep the defaults of the bot.
          if [[ -n "$STORE_BRANCH" ]]; then args+=(--store-branch "$STORE_BRANCH"); fi
          if [[ -n "$STORE_PATH" ]]; then args+=(--store-path "$STORE_PATH"); fi
          if [[ -n "$CLA_URL" ]]; then args+=(--cla-url "$CLA_URL"); fi
          if [[ -n "$INTRODUCTION_URL" ]]; then args+=(--introduction-url "$INTRODUCTION_URL"); fi
          if [[ -n "$STATUS_CONTEXT" ]]; then args+=(--status-context "$STATUS_CONTEXT"); fi
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi

          "$RUNNER_TEMP/avalonia-contribution-bot" "${args[@]}"
