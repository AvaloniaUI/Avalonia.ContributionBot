name: Release

on:
  workflow_dispatch:

permissions: {}

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      ASSET: avalonia-contribution-bot-linux-x64
      DOTNET_NOLOGO: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Read version
        shell: bash
        run: |
          set -euo pipefail

          version="$(dotnet msbuild src/Avalonia.ContributionBot -getProperty:Version)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The project version must be in the major.minor.patch format, got '$version'."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "::error::The tag v$version already exists. Update Version in Directory.Build.props before releasing."
            exit 1
          fi

          echo "Releasing version $version."
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Publish (Native AOT, linux-x64)
        run: >-
          dotnet publish src/Avalonia.ContributionBot --configuration Release --runtime linux-x64
          -p:ContinuousIntegrationBuild=true

      - name: Prepare the asset
        id: asset
        shell: bash
        run: |
          set -euo pipefail

          cp artifacts/publish/Avalonia.ContributionBot/release_linux-x64/Avalonia.ContributionBot "$RUNNER_TEMP/$ASSET"
          path="$RUNNER_TEMP/$ASSET"

          actual="$("$path" --version)"
          if [[ "$actual" != "$VERSION"* ]]; then
            echo "::error::The binary reports version '$actual', expected $VERSION."
            exit 1
          fi

          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$path" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.asset.outputs.path }}

      # The tagged commit pins the binary in action.yml
      - name: Create the release commit and tags
        shell: bash
        env:
          SHA256: ${{ steps.asset.outputs.sha256 }}
        run: |
          set -euo pipefail

          tag="v$VERSION"
          major="v${VERSION%%.*}"
          workflow=.github/workflows/contribution-bot.yml

          if ! grep --quiet --line-regexp " *uses: $GITHUB_REPOSITORY@$major" "$workflow"; then
            echo "::error::The reusable workflow must use the action at @$major. Update it on main before releasing $tag."
            exit 1
          fi

          sed -i \
            -e "s|^\( *BOT_REPOSITORY:\) \"\"$|\1 \"$GITHUB_REPOSITORY\"|" \
            -e "s|^\( *BOT_TAG:\) \"\"$|\1 \"$tag\"|" \
            -e "s|^\( *BOT_SHA256:\) \"\"$|\1 \"$SHA256\"|" \
            action.yml

          git diff
          if [[ "$(git diff --numstat)" != $'3\t3\taction.yml' ]]; then
            echo "::error::Pinning the release didn't change the expected lines."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --message "Release $tag" -- action.yml
          git tag "$tag"
          git tag --force "$major"
          git push origin "refs/tags/$tag"
          git push --force origin "refs/tags/$major"

      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.asset.outputs.path }}
          SHA256: ${{ steps.asset.outputs.sha256 }}
        run: |
          set -euo pipefail

          gh release create "v$VERSION" "$ASSET_PATH" \
            --verify-tag \
            --title "v$VERSION" \
            --generate-notes \
            --notes "SHA-256 of \`$ASSET\`: \`$SHA256\`"
