name: Avalonia Contribution Bot
description: Checks pull request authors against the vouch list and the CLA signatures, and handles the bot commands.
author: AvaloniaUI

inputs:
  token:
    description: >-
      GitHub token with access to the current repository (pull requests, issues, commit statuses and discussions: write)
      and to the store repository (contents: write).
    required: true
  store-repository:
    description: Repository holding the contributors file (owner/name).
    required: true
  store-branch:
    description: Branch holding the contributors file. Defaults to "main".
    required: false
  store-path:
    description: Path of the contributors file. Defaults to "contributors.json".
    required: false
  command-prefix:
    description: Prefix starting every bot command, such as !my-bot. Defaults to "!contribution-bot".
    required: false
  cla-url:
    description: Public URL of the Contributor License Agreement. Defaults to "https://github.com/AvaloniaUI/Avalonia/blob/main/CLA.md".
    required: false
  introduction-url:
    description: URL where new contributors introduce themselves. Defaults to "https://github.com/AvaloniaUI/Avalonia/discussions/new?category=introductions".
    required: false
  status-context:
    description: Context name of the commit status. Defaults to "Avalonia Contribution / CLA".
    required: false
  dry-run:
    description: Log write operations instead of performing them.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Download bot
      shell: bash
      env:
        # Written by the release workflow in the commit of each release tag.
        BOT_REPOSITORY: ""
        BOT_TAG: ""
        BOT_SHA256: ""
      run: |
        set -euo pipefail

        if [[ -z "$BOT_TAG" ]]; then
          echo "::error::This action only runs from a release tag, such as @v1."
          exit 1
        fi

        if [[ "$RUNNER_OS" != "Linux" || "$RUNNER_ARCH" != "X64" ]]; then
          echo "::error::This action requires a Linux x64 runner, got $RUNNER_OS $RUNNER_ARCH."
          exit 1
        fi

        bot="$RUNNER_TEMP/avalonia-contribution-bot"
        curl --fail --silent --show-error --location --retry 3 --output "$bot" \
          "https://github.com/$BOT_REPOSITORY/releases/download/$BOT_TAG/avalonia-contribution-bot-linux-x64"
        echo "$BOT_SHA256  $bot" | sha256sum --check --strict
        chmod +x "$bot"

    - name: Run bot
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        STORE_REPOSITORY: ${{ inputs.store-repository }}
        STORE_BRANCH: ${{ inputs.store-branch }}
        STORE_PATH: ${{ inputs.store-path }}
        COMMAND_PREFIX: ${{ inputs.command-prefix }}
        CLA_URL: ${{ inputs.cla-url }}
        INTRODUCTION_URL: ${{ inputs.introduction-url }}
        STATUS_CONTEXT: ${{ inputs.status-context }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        set -euo pipefail

        args=(
          --event-name "$GITHUB_EVENT_NAME"
          --event-file "$GITHUB_EVENT_PATH"
          --store-repository "$STORE_REPOSITORY"
        )

        # Empty inputs keep the defaults of the bot.
        if [[ -n "$STORE_BRANCH" ]]; then args+=(--store-branch "$STORE_BRANCH"); fi
        if [[ -n "$STORE_PATH" ]]; then args+=(--store-path "$STORE_PATH"); fi
        if [[ -n "$COMMAND_PREFIX" ]]; then args+=(--command-prefix "$COMMAND_PREFIX"); fi
        if [[ -n "$CLA_URL" ]]; then args+=(--cla-url "$CLA_URL"); fi
        if [[ -n "$INTRODUCTION_URL" ]]; then args+=(--introduction-url "$INTRODUCTION_URL"); fi
        if [[ -n "$STATUS_CONTEXT" ]]; then args+=(--status-context "$STATUS_CONTEXT"); fi
        if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi

        "$RUNNER_TEMP/avalonia-contribution-bot" "${args[@]}"
